[project]
name = "myaudi-mcp"
version = "0.1.0"
description = "MCP server for the myAudi connected-car service (status, climatisation, charging)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.10",
]

[project.scripts]
myaudi-mcp = "myaudi_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myaudi_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["myaudi_mcp", "fake_audi"]
